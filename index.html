<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truy cập bị từ chối</title>
  <meta name="description" content="Bạn không có quyền truy cập.">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #dde3ea;
      --text: #1a1d21;
      --muted: #697586;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: 36px 32px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      text-align: center;
      box-shadow: 0 10px 28px rgba(26, 34, 46, 0.06);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.1rem;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Bạn không có quyền truy cập</h1>
    <p>Vui lòng liên hệ quản trị viên nếu bạn cần quyền truy cập vào khu vực này.</p>
  </main>
</body>
</html>
