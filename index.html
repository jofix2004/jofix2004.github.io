<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniGa Studio</title>
  <meta name="description" content="Trang gốc AniGa Studio.">
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #dde3ea;
      --text: #1a1d21;
      --muted: #697586;
      --link: #2457a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Roboto, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.05;
    }

    p {
      margin: 0 0 14px;
      line-height: 1.65;
      color: var(--muted);
    }

    a {
      color: var(--link);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.14em;
    }
  </style>
</head>
<body>
  <main>
    <h1>AniGa Studio</h1>
    <p>Trang gốc của studio đang được thiết lập.</p>
    <p>Tài liệu dự án HYBRID được đọc tại <a href="/hybrid-game-project-docs/">/hybrid-game-project-docs/</a>.</p>
  </main>
</body>
</html>
